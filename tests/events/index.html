<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <link rel="stylesheet" href="/tests/events/css/styles.css">
    <title>Practica de Eventos</title>
</head>

<body>
    <header id="header">
        <h1 id="title">Mi Sitio Web</h1>
        <button id="changeTitle">
            Cambiar titulo
        </button>
    </header>
    <section>
        <p>Servicios: </p>
        <ul id="Services">
            <li class="default">Servicio 1</li>
            <li class="default">Servicio 2</li>
        </ul>
        <div class="container">
            <p>Elementos existentes:</p>
            <span id="countServices"></span>
        </div>

        <button id="addServices">
            Añadir Servicio
        </button>
        <button id="addServiceType">Añadir Tipo de Servicio</button>

        <button id="deleteService">Borrar Ultimo Servicio</button>
    </section>
    <section>
        <button id="darkMode">Modo oscuro</button>
    </section>
    <section>
        <input type="text" id="in">
        <p id="out"></p>
    </section>
    <script src="/tests/events/js/scripts.js"></script>
</body>

</html>
